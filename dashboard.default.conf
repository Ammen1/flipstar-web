# Static server for the private dashboard image (Dockerfile.dashboard).
#
# Who may reach this at all is decided before a request gets here: the
# dashboard Ingress's source-range allowlist, and then -- for every byte of
# data -- the API's own checks (AdminPathGuardMiddleware and each view's
# permissions). This file's job is narrower: make the page hard to misuse once
# it is loaded.
#
# Every header is set ONCE, at server level. nginx's add_header does not
# merge: a single add_header inside a location silently discards everything
# inherited from the server block, which is how security headers usually go
# missing. Per-path differences go through the map below instead, and
# tests/dashboardSplit.test.js fails if a location grows its own add_header.

map "$status:$uri" $dashboard_cache_control {
    # Content-hashed bundles (see vite.dashboard.config.js) never change under
    # the same name, so a browser may keep them for a year. Successful
    # responses only: a 404 cached that long would outlive the rollout that
    # briefly caused it.
    "~^(200|304):/assets/"  "public, max-age=31536000, immutable";

    # Everything else -- index.html above all -- is fetched fresh, so a deploy
    # is picked up on the next load and nothing lingers in a shared cache.
    default                 "no-store";
}

server {
    # 8080, not 80: nginx-unprivileged (uid 101) cannot bind a privileged
    # port. Must stay in step with EXPOSE in Dockerfile.dashboard and
    # containerPort in k8s/base/dashboard/deployment.yaml.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $dashboard_cache_control always;

    # The API is same-origin (/api on this host, Dockerfile.dashboard), so
    # scripts and connections need nothing but 'self'. The allowances:
    #   style-src 'unsafe-inline'  React style props and <style> blocks in the
    #                              admin pages. Styles, never scripts.
    #   fonts.googleapis/gstatic   AdminApp loads the platform's chosen
    #                              Google Fonts by <link>.
    #   img-src/media-src https:   Media URLs come back absolute from the API,
    #                              some built from BACKEND_URL (another host).
    #                              An image cannot execute; a script can, and
    #                              script-src stays 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # same-origin: the API still sees a Referer (Django's CSRF check reads it
    # on HTTPS), while font and image hosts learn nothing about this one.
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Kubernetes probe target; keeps probe traffic out of the logs.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # A missing bundle is a 404, never index.html: HTML served under a .js
    # name fails as a confusing MIME error instead of an honest not-found.
    location /assets/ {
        try_files $uri =404;
    }

    # The dashboard keeps its page in its own state, not in the URL, but any
    # deep link still lands on the app rather than a 404.
    location / {
        try_files $uri /index.html;
    }
}
