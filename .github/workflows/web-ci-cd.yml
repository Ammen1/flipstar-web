# Build, scan and ship the FlipStar web SPA -- and, from the same commit, the
# private staff dashboard (Dockerfile.dashboard), as a second image.
#
# The Kubernetes manifests for this app do NOT live here -- they are in
# Ammen1/flip-star under k8s/base/web, because that is the repository Argo CD
# watches. This workflow therefore ends by pushing a one-line image-tag change
# to that repo, which is what actually triggers the deploy. That cross-repo
# push is the only reason a PAT is needed; everything else uses GITHUB_TOKEN.
#
# DELIBERATELY USES ONLY actions/checkout.
# Everything docker/build-push-action, docker/login-action,
# docker/setup-buildx-action and aquasecurity/trivy-action would do is a few
# shell commands against tools ubuntu-latest already ships. Keeping the
# dependency surface at one first-party action means no Actions allow-list,
# no third-party tag moving under us, and nothing to audit but this file.
name: web-ci-cd

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A second push while the first is mid-flight would race on the GitOps commit
# and could deploy the older SHA. Queue instead of cancelling: a build that
# has already pushed an image should finish recording it.
concurrency:
  group: web-ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_WEB: ghcr.io/ammen1/flipstar-web
  # The private staff dashboard (Dockerfile.dashboard). Keep this package
  # PRIVATE in GHCR; the node pulls it with the same registries.yaml
  # credential it uses for every other ghcr.io image.
  IMAGE_DASHBOARD: ghcr.io/ammen1/flipstar-dashboard
  GITOPS_REPO: Ammen1/flip-star
  GITOPS_BRANCH: main
  KUSTOMIZE_VERSION: "5.4.3"
  TRIVY_VERSION: "v0.74.0"
  # Buildx otherwise uploads a build record to the Actions artifact store on
  # every run. Actions artifacts and Packages share ONE storage quota, and
  # exhausting it fails the run with "Artifact storage quota has been hit" --
  # which is what broke the backend pipeline. These records are never read.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Built locally, NOT pushed. The image has to exist on the runner so
      # Trivy can scan the exact artifact that will be published -- scanning
      # after the push would mean a vulnerable image is already in the registry
      # and pullable, which defeats the gate.
      - name: Build image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.uat.flipstar.et/api/v1 \
            --build-arg VITE_ENVIRONMENT=staging \
            --tag "${IMAGE_WEB}:${GITHUB_SHA}" \
            .

      - name: Install Trivy
        # Pinned tarball straight from the GitHub release, checksum-verified.
        #
        # This used to pipe contrib/install.sh from `main` into sh, and it
        # failed right after printing "found version" -- not because of the
        # bindir permissions, but because the pinned version no longer exists:
        # Aqua has deleted every release between v0.26.0 and v0.69.2, v0.56.2
        # among them. The script fetches the checksum from the release
        # (GITHUB_DOWNLOAD/$TAG/...), that 404s, and `set -e` ends the run
        # before it ever tries to write the binary.
        #
        # Fetching the release directly also settles the other half of the
        # problem: that script is unpinned and now routes the binary through
        # get.trivy.dev rather than the release assets, so it can change under
        # this workflow at any time -- exactly what the no-third-party-actions
        # rule at the top of this file exists to prevent. Bumping
        # TRIVY_VERSION is now the only thing needed to move versions.
        run: |
          version="${TRIVY_VERSION#v}"
          tarball="trivy_${version}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"

          mkdir -p "${RUNNER_TEMP}/trivy" "${RUNNER_TEMP}/bin"
          cd "${RUNNER_TEMP}/trivy"

          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/trivy_${version}_checksums.txt"

          # Only the tarball is in this directory, so --ignore-missing checks
          # exactly it. sha256sum exits non-zero if nothing was verified, so a
          # renamed asset fails here rather than installing something unchecked.
          sha256sum --ignore-missing -c checksums.txt

          tar -xzf "${tarball}" trivy
          install -m 0755 trivy "${RUNNER_TEMP}/bin/trivy"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/trivy" --version

      # No continue-on-error, and no `|| true`. A CRITICAL or HIGH finding
      # fails the step, and every step below it -- including the push and the
      # whole GitOps job -- is skipped. If a base image carries an unfixable
      # finding, raise the nginx/node tag in the Dockerfile; do not relax this.
      - name: Scan image (Trivy)
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --no-progress \
            "${IMAGE_WEB}:${GITHUB_SHA}"

      # Everything below runs only on a real push -- a pull_request build is
      # verified and thrown away, never published.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE_WEB}:${GITHUB_SHA}"

  # The private staff dashboard, from the same commit. Its own job, running
  # alongside the one above, so neither image can hold the other back -- and
  # the same gate: built locally, scanned, pushed only if the scan passes.
  build-scan-push-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # /api/v1 is same-origin: the dashboard's Ingress routes /api on its
      # own host to the backend. Never pass anything secret as a build arg
      # here -- every VITE_* value is written into the JavaScript that each
      # browser downloads.
      - name: Build dashboard image
        run: |
          docker build \
            --file Dockerfile.dashboard \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --build-arg VITE_ENVIRONMENT=staging \
            --tag "${IMAGE_DASHBOARD}:${GITHUB_SHA}" \
            .

      - name: Install Trivy
        # Identical to the step in build-scan-push; its comments apply.
        run: |
          version="${TRIVY_VERSION#v}"
          tarball="trivy_${version}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"

          mkdir -p "${RUNNER_TEMP}/trivy" "${RUNNER_TEMP}/bin"
          cd "${RUNNER_TEMP}/trivy"

          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/trivy_${version}_checksums.txt"

          sha256sum --ignore-missing -c checksums.txt

          tar -xzf "${tarball}" trivy
          install -m 0755 trivy "${RUNNER_TEMP}/bin/trivy"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/trivy" --version

      # Same rule as the web scan: no continue-on-error, no `|| true`.
      - name: Scan dashboard image (Trivy)
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --no-progress \
            "${IMAGE_DASHBOARD}:${GITHUB_SHA}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push dashboard image
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE_DASHBOARD}:${GITHUB_SHA}"

  update-gitops-staging:
    needs: [build-scan-push, build-scan-push-dashboard]
    # Runs when EITHER image was pushed, and records only the ones that were:
    # a broken dashboard build must not hold back a public-app release, nor
    # the reverse. !cancelled() is what lets this job read the two results
    # instead of being skipped by the first failure.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      (needs.build-scan-push.result == 'success' ||
       needs.build-scan-push-dashboard.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GITOPS_TOKEN is a fine-grained PAT owned by Ammen1, scoped to
      # Ammen1/flip-star with Contents: read and write. GITHUB_TOKEN cannot be
      # used: its scope stops at this repository, and the manifests live in
      # another one owned by a different account entirely.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Install kustomize
        # Into RUNNER_TEMP, not /usr/local/bin: the runner image ships its own
        # kustomize there and upstream's installer refuses to overwrite it,
        # exiting 1. Prepending to PATH also guarantees the pinned version runs
        # rather than the runner's bundled copy.
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- "${KUSTOMIZE_VERSION}" "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Set web image tag in the staging overlay
        if: needs.build-scan-push.result == 'success'
        working-directory: k8s/overlays/staging
        env:
          SHA: ${{ needs.build-scan-push.outputs.image-tag }}
        run: kustomize edit set image "${IMAGE_WEB}=${IMAGE_WEB}:${SHA}"

      - name: Set dashboard image tag in the staging overlay
        if: needs.build-scan-push-dashboard.result == 'success'
        working-directory: k8s/overlays/staging
        env:
          SHA: ${{ needs.build-scan-push-dashboard.outputs.image-tag }}
        run: kustomize edit set image "${IMAGE_DASHBOARD}=${IMAGE_DASHBOARD}:${SHA}"

      - name: Commit and push
        env:
          SHA: ${{ github.sha }}
          WEB: ${{ needs.build-scan-push.result }}
          DASHBOARD: ${{ needs.build-scan-push-dashboard.result }}
        run: |
          deployed=""
          if [ "${WEB}" = "success" ]; then deployed="web"; fi
          if [ "${DASHBOARD}" = "success" ]; then deployed="${deployed:+${deployed}+}dashboard"; fi

          git config user.name "flipstar-ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No change -- ${deployed} image tag already at ${SHA}."
          else
            git commit -m "chore(gitops): deploy ${deployed} ${SHA} to staging"
            git push origin "${GITOPS_BRANCH}"
          fi
