server {
    # 8080, not 80: the runtime image is nginx-unprivileged (uid 101), which
    # cannot bind a privileged port. Must stay in step with EXPOSE in the
    # Dockerfile and containerPort in k8s/base/web/deployment.yaml.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes probe target. Deliberately a bare `return 200` rather than /
    # -- the build inlines the entire JS bundle into index.html (~2MB), and
    # the liveness probe would otherwise transfer that every 15 seconds.
    # access_log off keeps probe traffic out of the container logs.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The build inlines the whole JS bundle into index.html (see
    # selfContainedHtmlForWebview in vite.config.js), so there are no
    # content-hashed chunks to bust the cache. Without an explicit no-store the
    # browser applies heuristic caching and keeps running the previous release
    # after a deploy. Never cache the entry document.
    # try_files below internally redirects to /index.html, so this exact-match
    # block is what actually sets the headers on the served document.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static media (images, fonts) keep their own filenames and are safe to
    # cache; they are not part of the inlined bundle.
    location /assets/ {
        expires 30d;
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
